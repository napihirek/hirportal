<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --sand: #e8c98b;
            --gold: #d7a83d;
            --clay: #9b4f2f;
            --rust: #7c3826;
            --dark: #1b100d;
            --dark2: #2a1711;
            --cream: #f5e7c8;
            --muted: #c8aa7b;
        }

        body {
            margin: 0;
            padding: 20px 10px 40px;
            min-height: 100vh;
            color: var(--cream);
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(197,139,58,.20) 0 2px, transparent 3px),
                radial-gradient(circle at 85% 25%, rgba(157,71,40,.18) 0 2px, transparent 3px),
                linear-gradient(135deg, rgba(91,42,28,.55) 0 8%, transparent 8% 92%, rgba(91,42,28,.45) 92%),
                repeating-linear-gradient(
                    45deg,
                    #160c09 0 18px,
                    #24130e 18px 36px,
                    #1a0e0b 36px 54px
                );
            background-size: auto, auto, auto, auto;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .18;
            background:
                repeating-linear-gradient(90deg, transparent 0 42px, #d7a83d 42px 44px, transparent 44px 84px),
                repeating-linear-gradient(0deg, transparent 0 42px, #7c3826 42px 44px, transparent 44px 84px);
            mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
        }

        .container {
            position: relative;
            max-width: 680px;
            margin: 0 auto;
            padding: 26px;
            text-align: center;
            background:
                linear-gradient(rgba(31,17,12,.95), rgba(31,17,12,.95)),
                repeating-linear-gradient(45deg, transparent 0 12px, rgba(215,168,61,.05) 12px 14px);
            border: 3px solid var(--clay);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0,0,0,.75);
        }

        .container::before,
        .container::after {
            content: "◆  ▲  ◆";
            display: block;
            color: var(--gold);
            letter-spacing: 10px;
            font-size: 14px;
            margin: 0 auto 14px;
            opacity: .8;
        }

        .container::after {
            margin: 20px auto 0;
        }

        .header-tag {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 999px;
            color: #fff2cc;
            background: linear-gradient(135deg, var(--rust), #b76a32);
            border: 1px solid var(--gold);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            margin: 12px 0 7px;
            color: #f0c95c;
            font-size: 28px;
            text-shadow: 2px 2px 5px #000;
        }

        .subtitle {
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 14px;
            font-style: italic;
        }

        .ad-banner-box {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px;
            margin: 16px 0;
            padding: 8px;
            overflow: hidden;
            border: 1px dashed #805033;
            border-radius: 10px;
            background: rgba(10,6,4,.55);
        }

        #wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 22px 0;
        }

        .wheel-container {
            position: relative;
            width: min(330px, 82vw);
            height: min(330px, 82vw);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border: 7px solid var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(215,168,61,.32), inset 0 0 0 4px #3c2115;
            transition: transform 4s cubic-bezier(.15,.9,.2,1);
            background: #20110d;
        }

        .wheel-pointer {
            position: absolute;
            z-index: 10;
            top: -17px;
            left: 50%;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 28px solid #f0c95c;
            filter: drop-shadow(0 2px 4px #000);
        }

        .spin-btn,
        .retry-btn {
            cursor: pointer;
            font-family: Georgia, serif;
            font-weight: bold;
        }

        .spin-btn {
            margin-top: 22px;
            padding: 14px 36px;
            color: #20110d;
            background: linear-gradient(135deg, #f0c95c, #a87424);
            border: 2px solid #f8e5a8;
            border-radius: 50px;
            box-shadow: 0 7px 22px rgba(215,168,61,.28);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover { transform: scale(1.04); }
        .spin-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

        #result-box {
            display: none;
            margin-top: 15px;
            animation: fadeIn .7s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .totem-card {
            padding: 18px;
            text-align: center;
            background:
                linear-gradient(rgba(43,24,16,.96), rgba(43,24,16,.96)),
                repeating-linear-gradient(45deg, transparent 0 10px, rgba(215,168,61,.06) 10px 12px);
            border: 3px solid var(--gold);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.8);
        }

        /* JAVÍTOTT KÉPMÉRETEZÉS */
        .totem-card img {
            display: block;
            width: 100%;
            max-height: 320px;
            height: auto;
            margin: 12px 0;
            object-fit: contain;
            border: 2px solid #9b6a3b;
            border-radius: 9px;
            background: #120a07;
        }

        .totem-label {
            color: #b96b36;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .totem-title {
            margin: 8px 0;
            color: #f0c95c;
            font-size: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .totem-quote {
            margin: 12px 0;
            padding: 11px;
            color: var(--cream);
            background: rgba(0,0,0,.35);
            border-left: 4px solid var(--gold);
            border-radius: 8px;
            font-size: 15px;
            font-style: italic;
        }

        .totem-desc {
            color: #d4ba91;
            line-height: 1.55;
            font-size: 13px;
        }

        #audio-box {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #805033;
            border-radius: 10px;
            background: rgba(16,9,6,.72);
        }

        #audio-box audio {
            width: 100%;
            height: 38px;
        }

        .audio-note {
            margin: 5px 0 0;
            color: #c7a97b;
            font-size: 11px;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-download { background: #257a43; }
        .btn-fb { background: #2857a8; }
        .btn-pin { background: #b21f32; }

        .retry-btn {
            margin-top: 16px;
            padding: 10px 22px;
            color: var(--gold);
            background: transparent;
            border: 2px solid var(--gold);
            border-radius: 22px;
        }

        .retry-btn:hover {
            color: #1c100b;
            background: var(--gold);
        }

        @media (max-width: 500px) {
            body { padding: 10px 7px 30px; }
            .container { padding: 18px 13px; }
            h1 { font-size: 23px; }
            .totem-card img { max-height: 250px; }
        }
    </style>
</head>

<body>

        <span class="header-tag">Sacred Spirit Totem Wheel</span>

        <div class="subtitle">
